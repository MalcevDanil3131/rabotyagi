name: rabotyagi-demo

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    labels:
      rabotyagi.purpose: docker-demo
    environment:
      POSTGRES_DB: rabotyagi_demo_docker
      POSTGRES_USER: demo_admin
      POSTGRES_PASSWORD: ${RABOTYAGI_DEMO_DB_PASSWORD:?Start the demo with Start-Demo.cmd}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U demo_admin -d rabotyagi_demo_docker]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    image: rabotyagi-demo-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      extra_hosts:
        - "registry.npmjs.org=${NPM_REGISTRY_IP:-104.16.24.34}"
    restart: unless-stopped
    labels:
      rabotyagi.purpose: docker-demo
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./frontend/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
    # Checks the actual API as well as the static frontend.
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/healthz && wget -q --header='X-Rabotyagi-Demo: 1' -O /dev/null http://127.0.0.1/api/demo/accounts"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12

  api:
    image: rabotyagi-demo-api
    build:
      context: .
      dockerfile: rabotyagi/Dockerfile
    restart: unless-stopped
    labels:
      rabotyagi.purpose: docker-demo
    # Nginx and Kestrel share loopback. DemoRuntime can retain its local-peer guard.
    # Only Nginx publishes a port, and only on the host's loopback interface.
    network_mode: service:frontend
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      DOTNET_ENVIRONMENT: Demo
      Demo__Enabled: "true"
      Demo__Port: "5189"
      BootstrapAdmin__Enabled: "false"
      ConnectionStrings__DemoConnection: "Host=postgres;Port=5432;Database=rabotyagi_demo_docker;Username=demo_admin;Password=${RABOTYAGI_DEMO_DB_PASSWORD:?Start the demo with Start-Demo.cmd}"
      RequestSecurity__AllowedOrigins__0: http://127.0.0.1:3001
      RequestSecurity__AllowedOrigins__1: http://localhost:3001
    volumes:
      - demo_files:/app/.demo
    depends_on:
      postgres:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
    labels:
      rabotyagi.purpose: docker-demo
  demo_files:
    labels:
      rabotyagi.purpose: docker-demo
